<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>酒店助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand-row">
        <img class="logo" src="../assets/icons/icon128.png" alt="LIVV">
        <span class="brand">酒店助手</span>
        <span class="page-type" id="pageType">—</span>
      </div>
      <span class="ver" id="appVer">v0.4.0</span>
    </header>

    <nav>
      <button data-tab="results" class="on">采集结果</button>
      <button data-tab="tasks">任务状态</button>
      <button data-tab="device">设备状态</button>
    </nav>

    <section id="results" class="tab on">
      <div class="ctx" id="pageCtx">
        <span class="plat-logo" id="platLogo">—</span>

        <span class="ctx-place" id="ctxPlace">
          —
        </span>

        <span class="ctx-dates">
          <span id="ctxIn">—</span>
          <span class="ctx-arrow">→</span>
          <span id="ctxOut">—</span>
        </span>

        <span class="dtag" id="ctxD">—</span>

        <span id="ctxMarket" hidden>—</span>
        <span id="ctxCity" hidden>—</span>
        <span id="ctxKw" hidden>—</span>
      </div>
      <div class="primary-actions">
        <button id="collect" class="primary">
          采集当前页
        </button>

        <button id="upload" class="ghost">
          上传本次结果
        </button>
      </div>

      <div class="stats">
        <div>
          <em>检测</em>
          <b id="stAll">0</b>
        </div>

        <div class="ok">
          <em>可售</em>
          <b id="stAvail">0</b>
        </div>

        <div class="sold">
          <em>官方ID</em>
          <b id="stSold">0/0</b>
        </div>

        <div class="err">
          <em>异常</em>
          <b id="stIssue">0</b>
        </div>

        <b id="stAd" hidden>0</b>
        <b id="stErr" hidden>0</b>
      </div>
      <p id="collectStatus" class="status"></p>
      <div id="resultList"></div>
    </section>

    <section id="tasks" class="tab">
      <div class="empty">
        <strong>云端任务尚未开放</strong>
        <p>当前只支持打开 OTA 列表后手动采集。</p>
      </div>
      <div class="log-card">
        <h3>最近记录</h3>
        <ol class="log-list" id="logList"></ol>
      </div>
    </section>

    <section id="device" class="tab">
      <div class="device-section-title">
        打开 OTA
      </div>

      <div class="platforms" id="platforms">
        <button type="button" data-p="ctrip" data-url="https://hotels.ctrip.com/">携程</button>
        <button type="button" data-p="meituan" data-url="https://hotel.meituan.com/">美团</button>
        <button type="button" data-p="fliggy" data-url="https://hotel.fliggy.com/">飞猪</button>
        <button type="button" data-p="tongcheng" data-url="https://www.ly.com/hotel/">同程</button>
      </div>

      <div class="device-section-title">
        当前设备
      </div>

      <div class="device-card" id="deviceSummary">
        读取设备中…
      </div>

      <div class="device-section-title diagnostic-title">
        诊断工具
      </div>

      <button
        id="probe"
        class="diagnostic-button"
        type="button"
      >
        探测当前页面
      </button>

      <pre id="domProbe" class="probe" hidden></pre>

      <button id="compareM04" hidden type="button">
        M04 对比
      </button>

      <button id="testM04" hidden type="button">
        M04 测试
      </button>
    </section>

    <footer>
      <span>服务状态 <i class="dot" id="svcDot"></i> <b id="svcText">检测中</b></span>
      <span>授权状态 <i class="dot" id="authDot"></i> <b id="authText">—</b></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
